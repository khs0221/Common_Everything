name: 회의 녹음 프로그램 윈도우 빌드

on:
  push:
    paths:
      - "meeting-recorder/**"
      - ".github/workflows/meeting-recorder-build.yml"
  pull_request:
    paths:
      - "meeting-recorder/**"
      - ".github/workflows/meeting-recorder-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meeting-recorder-${{ github.ref }}
  cancel-in-progress: true

# exe 묶음(약 1.1GB)은 수동 실행과 기본 브랜치 push 때만 올립니다. 그 밖의 push·PR 은 시험과
# exe 자체 시험까지만 합니다(R3).
env:
  UPLOAD_BUNDLE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  convert-turbo:
    # large-v3-turbo 를 int8 로 저장한 모델을 만듭니다(R6). 리눅스에서 고정한 판의 변환 도구로 변환하고
    # 결과 해시를 mrec/models.py 와 비교합니다. 결과는 운영체제 공용 캐시로 윈도우 빌드에 넘깁니다.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: meeting-recorder
    steps:
      - uses: actions/checkout@v4
      - name: turbo int8 캐시
        id: turbo
        uses: actions/cache@v4
        with:
          path: meeting-recorder/models/faster-whisper-large-v3-turbo-int8
          key: mrec-turbo-int8-${{ hashFiles('meeting-recorder/mrec/models.py', 'meeting-recorder/tools/convert_turbo_int8.py', 'meeting-recorder/requirements-convert.txt') }}
          enableCrossOsArchive: true
      - uses: actions/setup-python@v5
        if: steps.turbo.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
      - name: 변환(원본 받기·해시 확인·int8 저장·결과 해시 확인)
        if: steps.turbo.outputs.cache-hit != 'true'
        timeout-minutes: 35
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-convert.txt
          for i in 1 2 3; do python -u tools/convert_turbo_int8.py && exit 0; echo "::warning::변환 실패($i/3)"; sleep 30; done
          exit 1

  build:
    needs: convert-turbo
    # 같은 저장소 브랜치의 PR 은 그 브랜치 push 로 이미 돌았으므로 건너뜁니다(같은 커밋 두 번 빌드 방지).
    # 다른 저장소에서 온 PR(포크)만 pull_request 로 돕니다.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: meeting-recorder
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            meeting-recorder/requirements.txt
            meeting-recorder/requirements-build.txt

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip list

      - name: turbo int8(변환 작업에서 만든 것)
        uses: actions/cache/restore@v4
        with:
          path: meeting-recorder/models/faster-whisper-large-v3-turbo-int8
          key: mrec-turbo-int8-${{ hashFiles('meeting-recorder/mrec/models.py', 'meeting-recorder/tools/convert_turbo_int8.py', 'meeting-recorder/requirements-convert.txt') }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: 모델 캐시(그 밖의 모델)
        uses: actions/cache@v4
        with:
          path: |
            meeting-recorder/models
            !meeting-recorder/models/faster-whisper-large-v3-turbo-int8
          key: mrec-models-${{ hashFiles('meeting-recorder/mrec/models.py') }}

      - name: 모델 받기(해시 확인)
        # 단계 전체 시간 제한 + 실패 시 두 번 더(이미 받은 파일은 해시가 맞으면 건너뜀). 파일마다 멈춤 감시·재시도는 스크립트 안에서.
        timeout-minutes: 30
        run: |
          for ($i = 1; $i -le 3; $i++) {
            python -u tools/download_models.py
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::모델 받기 실패($i/3), 30초 뒤 다시"
            Start-Sleep -Seconds 30
          }
          exit 1

      - name: 시험(pytest)
        run: python -m pytest -q

      - name: exe 빌드(PyInstaller)
        run: pyinstaller --noconfirm MeetingRecorder.spec

      - name: 모델·문서 넣기
        run: |
          $dist = "dist/MeetingRecorder"
          Copy-Item -Recurse models "$dist/models"
          Copy-Item README.md "$dist/사용법.md"
          New-Item -ItemType Directory -Force "$dist/licenses" | Out-Null
          Copy-Item docs/라이선스.md "$dist/licenses/라이선스.md"
          Copy-Item models/sherpa-onnx-pyannote-segmentation-3-0/LICENSE "$dist/licenses/pyannote-segmentation-3.0-LICENSE.txt"
          # 분야 용어 파일: 사용자가 메모장으로 고칠 수 있게 exe 옆 glossary 폴더에 그대로 둠(R4)
          Copy-Item -Recurse glossary "$dist/glossary"
          if (Test-Path "docs/용어/출처.md") { Copy-Item "docs/용어/출처.md" "$dist/licenses/용어_출처.md" }

      - name: 자체 시험(exe --selftest, 장치 불필요)
        run: |
          $out = Join-Path $PWD "selftest.json"
          $exe = Resolve-Path "dist/MeetingRecorder/MeetingRecorder.exe"
          $p = Start-Process -FilePath $exe -ArgumentList @("--selftest", "--selftest-out", "`"$out`"") -PassThru
          $null = $p.Handle   # 핸들을 잡아 두어야 끝난 뒤 ExitCode 를 읽을 수 있음
          if (-not $p.WaitForExit(900000)) { $p.Kill(); Write-Host "::error::selftest 15분 초과"; exit 1 }
          $p.WaitForExit()
          $code = $p.ExitCode
          Write-Host "exit code: $code"
          if (-not (Test-Path $out)) { Write-Host "::error::selftest.json 없음"; exit 1 }
          Get-Content $out -Encoding utf8
          $rep = Get-Content $out -Raw -Encoding utf8 | ConvertFrom-Json
          $ok = $rep.ok
          if ($rep.failed_summary) {
            Write-Host "=== selftest 실패 항목 ==="
            foreach ($line in $rep.failed_summary) { Write-Host "::error::$line" }
          }
          # 판정: 결과 파일의 ok 가 true 이고, 종료 코드가 0(또는 읽지 못해 비어 있음)일 때만 성공
          if ($ok -ne $true) { Write-Host "::error::selftest 실패(ok=$ok)"; exit 1 }
          if ($null -ne $code -and $code -ne 0) { Write-Host "::error::selftest 종료 코드 $code"; exit 1 }

      - name: 크기·구성 확인
        if: always()
        run: |
          $dist = "dist/MeetingRecorder"
          if (Test-Path $dist) {
            $mb = (Get-ChildItem -Recurse $dist | Measure-Object -Property Length -Sum).Sum / 1MB
            Write-Host ("전체 크기(압축 전): {0:N0} MB" -f $mb)
            foreach ($m in @("faster-whisper-base", "faster-whisper-large-v3-turbo-int8")) {
              if (Test-Path "$dist/models/$m/model.bin") { Write-Host "포함: $m" } else { Write-Host "::error::$m 이 묶음에 없습니다" }
            }
            Get-ChildItem "$dist/_internal" -Directory | ForEach-Object {
              $s = (Get-ChildItem -Recurse $_.FullName | Measure-Object -Property Length -Sum).Sum / 1MB
              "{0,8:N1} MB  {1}" -f $s, $_.Name } | Sort-Object | Select-Object -Last 15
            foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
              $found = Get-ChildItem -Recurse $dist -Filter $dll -ErrorAction SilentlyContinue
              if ($found) { Write-Host "포함: $dll" } else { Write-Host "::warning::$dll 이 묶음에 없습니다(사용자 PC 에 VC++ 런타임이 없으면 실행 실패 가능)" }
            }
            foreach ($bad in @("av", "huggingface_hub", "onnxruntime")) {
              if (Test-Path "$dist/_internal/$bad") { Write-Host "::warning::$bad 가 묶음에 들어 있습니다" }
            }
            if (Get-ChildItem -Recurse $dist -Filter "cudnn*.dll" -ErrorAction SilentlyContinue) { Write-Host "::warning::cudnn DLL 이 묶음에 들어 있습니다" }
          }

      - name: selftest 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-result
          path: meeting-recorder/selftest.json
          if-no-files-found: warn
          retention-days: 7

      - name: 프로그램 올리기(zip, 수동 실행·기본 브랜치만)
        if: env.UPLOAD_BUNDLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MeetingRecorder-windows
          path: meeting-recorder/dist/MeetingRecorder
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: 묶음을 올리지 않은 이유 안내
        if: env.UPLOAD_BUNDLE != 'true'
        run: Write-Host "이 실행($env:GITHUB_EVENT_NAME, $env:GITHUB_REF)은 시험만 합니다. exe 묶음은 수동 실행(Run workflow) 또는 기본 브랜치 push 때 올립니다."
