name: 회의 녹음 프로그램 윈도우 빌드

on:
  push:
    paths:
      - "meeting-recorder/**"
      - ".github/workflows/meeting-recorder-build.yml"
  pull_request:
    paths:
      - "meeting-recorder/**"
      - ".github/workflows/meeting-recorder-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meeting-recorder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: meeting-recorder
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            meeting-recorder/requirements.txt
            meeting-recorder/requirements-build.txt

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip list

      - name: 모델 캐시
        uses: actions/cache@v4
        with:
          path: meeting-recorder/models
          key: mrec-models-${{ hashFiles('meeting-recorder/mrec/models.py') }}

      - name: 모델 받기(해시 확인)
        run: python tools/download_models.py

      - name: 시험(pytest)
        run: python -m pytest -q

      - name: exe 빌드(PyInstaller)
        run: pyinstaller --noconfirm MeetingRecorder.spec

      - name: 모델·문서 넣기
        run: |
          $dist = "dist/MeetingRecorder"
          Copy-Item -Recurse models "$dist/models"
          Copy-Item README.md "$dist/사용법.md"
          New-Item -ItemType Directory -Force "$dist/licenses" | Out-Null
          Copy-Item docs/라이선스.md "$dist/licenses/라이선스.md"
          Copy-Item models/sherpa-onnx-pyannote-segmentation-3-0/LICENSE "$dist/licenses/pyannote-segmentation-3.0-LICENSE.txt"

      - name: 자체 시험(exe --selftest, 장치 불필요)
        run: |
          $out = Join-Path $PWD "selftest.json"
          $exe = Resolve-Path "dist/MeetingRecorder/MeetingRecorder.exe"
          $p = Start-Process -FilePath $exe -ArgumentList @("--selftest", "--selftest-out", "`"$out`"") -PassThru
          $null = $p.Handle   # 핸들을 잡아 두어야 끝난 뒤 ExitCode 를 읽을 수 있음
          if (-not $p.WaitForExit(900000)) { $p.Kill(); Write-Host "::error::selftest 15분 초과"; exit 1 }
          $p.WaitForExit()
          $code = $p.ExitCode
          Write-Host "exit code: $code"
          if (-not (Test-Path $out)) { Write-Host "::error::selftest.json 없음"; exit 1 }
          Get-Content $out -Encoding utf8
          $rep = Get-Content $out -Raw -Encoding utf8 | ConvertFrom-Json
          $ok = $rep.ok
          if ($rep.failed_summary) {
            Write-Host "=== selftest 실패 항목 ==="
            foreach ($line in $rep.failed_summary) { Write-Host "::error::$line" }
          }
          # 판정: 결과 파일의 ok 가 true 이고, 종료 코드가 0(또는 읽지 못해 비어 있음)일 때만 성공
          if ($ok -ne $true) { Write-Host "::error::selftest 실패(ok=$ok)"; exit 1 }
          if ($null -ne $code -and $code -ne 0) { Write-Host "::error::selftest 종료 코드 $code"; exit 1 }

      - name: 크기·구성 확인
        if: always()
        run: |
          $dist = "dist/MeetingRecorder"
          if (Test-Path $dist) {
            $mb = (Get-ChildItem -Recurse $dist | Measure-Object -Property Length -Sum).Sum / 1MB
            Write-Host ("전체 크기(압축 전): {0:N0} MB" -f $mb)
            Get-ChildItem "$dist/_internal" -Directory | ForEach-Object {
              $s = (Get-ChildItem -Recurse $_.FullName | Measure-Object -Property Length -Sum).Sum / 1MB
              "{0,8:N1} MB  {1}" -f $s, $_.Name } | Sort-Object | Select-Object -Last 15
            foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
              $found = Get-ChildItem -Recurse $dist -Filter $dll -ErrorAction SilentlyContinue
              if ($found) { Write-Host "포함: $dll" } else { Write-Host "::warning::$dll 이 묶음에 없습니다(사용자 PC 에 VC++ 런타임이 없으면 실행 실패 가능)" }
            }
            foreach ($bad in @("av", "huggingface_hub", "onnxruntime")) {
              if (Test-Path "$dist/_internal/$bad") { Write-Host "::warning::$bad 가 묶음에 들어 있습니다" }
            }
            if (Get-ChildItem -Recurse $dist -Filter "cudnn*.dll" -ErrorAction SilentlyContinue) { Write-Host "::warning::cudnn DLL 이 묶음에 들어 있습니다" }
          }

      - name: selftest 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-result
          path: meeting-recorder/selftest.json
          if-no-files-found: warn
          retention-days: 30

      - name: 프로그램 올리기(zip)
        uses: actions/upload-artifact@v4
        with:
          name: MeetingRecorder-windows
          path: meeting-recorder/dist/MeetingRecorder
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
